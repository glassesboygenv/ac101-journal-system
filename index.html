  }else if(s.j==='D'){
    var d=s.k==='ap'?{a:'2101',dr:amt,cr:0,party:p}:s.k==='cash'?{a:'5101',dr:amt,cr:0}:{a:s.acct,dr:amt,cr:0};
    L=[d,{a:'1101',dr:0,cr:amt}];
  }else L=(s.lines||[]).map(function(l){return {a:l.a,dr:r2(parseFloat(l.dr)||0),cr:r2(parseFloat(l.cr)||0),party:clean(l.party)}});
  return {j:s.j,date:s.date,ref:clean(s.ref),desc:clean(s.desc),reason:clean(s.reason),lines:L};
}

/* ---------- ประมวลผล: ผ่านรายการไปบัญชีแยกประเภททั่วไปและบัญชีย่อย ---------- */
function derive(entries,inj){
  var byId=entries.slice().sort(function(a,b){return a.id-b.id}),cnt={P:0,S:0,R:0,D:0,G:0},jref={};
  byId.forEach(function(e){cnt[e.j]++;jref[e.id]=JM[e.j].abbr+cnt[e.j]});
  var ord=entries.slice().sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:a.id-b.id});
  var gl={},AR={},AP={};ACC.forEach(function(a){gl[a.code]=[]});
  ord.forEach(function(e){e.lines.forEach(function(l){
    var row={date:e.date,jref:jref[e.id],ref:e.ref,desc:e.desc,dr:l.dr||0,cr:l.cr||0,party:l.party||''};
    gl[l.a].push(row);
    if(l.a==='1102')(AR[l.party]=AR[l.party]||[]).push(row);
    if(l.a==='2101')(AP[l.party]=AP[l.party]||[]).push(row);
  })});
  var last=ord.length?ord[ord.length-1].date:'2026-11-30';
  if(inj&&inj.tb)gl['1101'].push({date:last,jref:'จำลอง',ref:'',desc:'รายการจำลองผิดพลาด: เดบิตข้างเดียว',dr:1000,cr:0,fake:true,party:''});
  if(inj&&inj.sub)gl['1102'].push({date:last,jref:'จำลอง',ref:'',desc:'รายการจำลองผิดพลาด: ลงบัญชีคุมแต่ไม่ลงบัญชีย่อย',dr:500,cr:0,fake:true,party:''});
  var bal={};ACC.forEach(function(a){var d=0,c=0;gl[a.code].forEach(function(r){d+=r.dr;c+=r.cr});bal[a.code]=r2(d-c)});
  var arBal={},apBal={};
  Object.keys(AR).forEach(function(p){var n=0;AR[p].forEach(function(r){n+=r.dr-r.cr});arBal[p]=r2(n)});
  Object.keys(AP).forEach(function(p){var n=0;AP[p].forEach(function(r){n+=r.cr-r.dr});apBal[p]=r2(n)});
  return {gl:gl,AR:AR,AP:AP,bal:bal,arBal:arBal,apBal:apBal,jref:jref,ord:ord};
}
function sum(o){var n=0;Object.keys(o).forEach(function(k){n+=o[k]});return r2(n)}
function trial(D){
  var rows=[],td=0,tc=0;
  ACC.forEach(function(a){if(!D.gl[a.code].length)return;var b=D.bal[a.code],dr=b>0?b:0,cr=b<0?-b:0;td+=dr;tc+=cr;rows.push({a:a,dr:dr,cr:cr})});
  return {rows:rows,td:r2(td),tc:r2(tc)};
}

/* ---------- ตรวจสอบก่อนบันทึก ---------- */
function checkEntry(e){
  if(!e.date)return 'กรุณาเลือกวันที่';
  if(!e.desc)return 'กรุณากรอกคำอธิบายรายการ';
  if(e.lines.length<2)return 'ต้องมีอย่างน้อย 2 บรรทัด (เดบิตและเครดิต)';
  var td=0,tc=0,i,l;
  for(i=0;i<e.lines.length;i++){
    l=e.lines[i];
    if(!AM[l.a])return 'บรรทัดที่ '+(i+1)+': กรุณาเลือกบัญชี';
    if(!((l.dr>0)!==(l.cr>0)))return 'บรรทัดที่ '+(i+1)+': ต้องกรอกเดบิตหรือเครดิตอย่างใดอย่างหนึ่ง และต้องมากกว่า 0';
    if((l.a==='1102'||l.a==='2101')&&!l.party)return 'บรรทัดที่ '+(i+1)+': บัญชี'+AM[l.a].name.split(' ')[0]+'ต้องระบุชื่อ'+(l.a==='1102'?'ลูกหนี้':'เจ้าหนี้')+' (เพื่อผ่านไปบัญชีย่อย)';
    td+=l.dr;tc+=l.cr;
  }
  td=r2(td);tc=r2(tc);
  if(td!==tc)return 'เดบิตไม่เท่ากับเครดิต: เดบิต '+fmt0(td)+' เครดิต '+fmt0(tc)+' ผลต่าง '+fmt0(Math.abs(r2(td-tc)))+' บาท';
  if(e.j==='G'){
    var has=function(code,side){return e.lines.some(function(x){return x.a===code&&x[side]>0})};
    if(e.lines.some(function(x){return x.a==='1101'}))return 'รายการที่เกี่ยวกับเงินสดต้องบันทึกในสมุดรายวันรับเงินหรือสมุดรายวันจ่ายเงิน ไม่ใช่สมุดรายวันทั่วไป';
    if(has('5101','dr')&&has('2101','cr'))return 'ซื้อสินค้าเชื่อต้องบันทึกในสมุดรายวันซื้อ ไม่ใช่สมุดรายวันทั่วไป';
    if(has('1102','dr')&&has('4101','cr'))return 'ขายสินค้าเชื่อต้องบันทึกในสมุดรายวันขาย ไม่ใช่สมุดรายวันทั่วไป';
  }
  return null;
}
function checkAll(entries){
  var D=derive(entries,null),p;
  if(D.bal['1101']<0)return 'เงินสดไม่พอ: ยอดเงินสดคงเหลือจะติดลบ '+fmt0(-D.bal['1101'])+' บาท';
  for(p in D.arBal)if(D.arBal[p]<0)return 'ยอดลูกหนี้ของ "'+p+'" จะติดลบ (รับชำระหรือรับคืนเกินยอดที่ค้างอยู่)';
  for(p in D.apBal)if(D.apBal[p]<0)return 'ยอดเจ้าหนี้ของ "'+p+'" จะติดลบ (จ่ายชำระหรือส่งคืนเกินยอดที่ค้างอยู่)';
  return null;
}
function tryAdd(spec){
  var e=makeEntry(spec),err=checkEntry(e);
  if(!err){e.id=S.seq+1;err=checkAll(S.entries.concat([e]))}
  if(err){S.rejects.unshift({t:Date.now(),j:e.j,msg:err,desc:e.desc||'(ไม่มีคำอธิบาย)'});S.rejects=S.rejects.slice(0,30);save();return err}
  e.id=++S.seq;S.entries.push(e);save();ui.last=e;return null;
}

  var h='<div class="panel"><h2>บัญชีแยกประเภททั่วไป</h2><label style="max-width:360px">เลือกบัญชี<select id="gl-sel"><option value="all">ทุกบัญชีที่มีรายการ ('+act.length+')</option>'+act.map(function(a){return '<option value="'+a.code+'"'+(a.code===sel?' selected':'')+'>'+esc(an(a.code))+'</option>'}).join('')+'</select></label><p class="hint">ด = ยอดคงเหลือด้านเดบิต, ค = ยอดคงเหลือด้านเครดิต</p></div>';
  (sel==='all'?act:[AM[sel]]).forEach(function(a){h+=glBlock(a,D)});
  return h;
}
function subBlock(title,map,rows,sign,ctl,ctlName,fakeNote){
  var names=Object.keys(map).sort(),tot=sum(map),h='<div class="panel"><h3>'+title+'</h3>';
  if(!names.length)return h+'<p class="empty">ยังไม่มีรายการ</p></div>';
  h+='<div class="tw"><table><thead><tr><th>ชื่อ</th><th class="num">ยอดคงเหลือ</th></tr></thead><tbody>'+names.map(function(p){return '<tr><td>'+esc(p)+'</td><td class="num">'+fmt0(map[p])+'</td></tr>'}).join('')+'<tr class="tot"><td>รวมบัญชีย่อย</td><td class="num">'+fmt0(tot)+'</td></tr><tr class="tot"><td>บัญชีคุม ('+ctlName+')</td><td class="num">'+fmt0(ctl)+'</td></tr></tbody></table></div>';
  h+=tot===ctl?'<div class="status ok">✓ ยอดรวมบัญชีย่อยตรงกับบัญชีคุม</div>':'<div class="status bad">✗ ยอดรวมบัญชีย่อยไม่ตรงกับบัญชีคุม ผลต่าง '+fmt0(Math.abs(r2(tot-ctl)))+' บาท ตรวจว่ามีรายการที่ลงบัญชีคุมแต่ไม่ลงบัญชีย่อยหรือไม่</div>';
  names.forEach(function(p){
    var run=0;
    h+='<details><summary>'+esc(p)+' · คงเหลือ '+fmt0(map[p])+'</summary><div class="tw"><table><thead><tr><th>วันที่</th><th>ที่</th><th>รายการ</th><th class="num">เดบิต</th><th class="num">เครดิต</th><th class="num">คงเหลือ</th></tr></thead><tbody>'
     +rows[p].map(function(r){run=r2(run+(r.dr-r.cr)*sign);return '<tr><td>'+fdate(r.date)+'</td><td>'+esc(r.jref)+'</td><td>'+esc(r.desc)+'</td><td class="num">'+fmt(r.dr)+'</td><td class="num">'+fmt(r.cr)+'</td><td class="num">'+fmt0(run)+'</td></tr>'}).join('')+'</tbody></table></div></details>';
  });
  return h+'</div>';
}
function vSub(){
  var D=derive(S.entries,S.inj);
  if(!S.entries.length)return '<div class="panel"><h2>บัญชีแยกประเภทย่อย</h2><p class="empty">ยังไม่มีรายการ</p></div>';
  return '<div class="two">'+subBlock('บัญชีแยกประเภทย่อย: ลูกหนี้การค้า',D.arBal,D.AR,1,D.bal['1102'],'1102 ลูกหนี้การค้า')+subBlock('บัญชีแยกประเภทย่อย: เจ้าหนี้การค้า',D.apBal,D.AP,-1,r2(-D.bal['2101']),'2101 เจ้าหนี้การค้า')+'</div>';
}
function vTB(){
  var D=derive(S.entries,S.inj),T=trial(D);
  var h='<div class="panel"><h2>งบทดลอง</h2><p class="hint">จัดทำจากยอดคงเหลือของบัญชีแยกประเภททั่วไป ณ วันที่ '+(D.ord.length?fdate(D.ord[D.ord.length-1].date):'-')+'</p>';
  if(!T.rows.length)return h+'<p class="empty">ยังไม่มีรายการ</p></div>';
  h+=T.td===T.tc?'<div class="status ok">✓ งบทดลองสมดุล: ยอดรวมเดบิตเท่ากับยอดรวมเครดิต '+fmt0(T.td)+' บาท</div>':'<div class="status bad">⚠ งบทดลองไม่สมดุล: ยอดรวมเดบิต '+fmt0(T.td)+' ยอดรวมเครดิต '+fmt0(T.tc)+' ผลต่าง '+fmt0(Math.abs(r2(T.td-T.tc)))+' บาท (ด้าน'+(T.td>T.tc?'เดบิตมากกว่า':'เครดิตมากกว่า')+')</div>';
  var ar=sum(D.arBal),ap=sum(D.apBal),arOk=ar===D.bal['1102'],apOk=ap===r2(-D.bal['2101']);
  h+='<div class="status '+(arOk&&apOk?'ok':'bad')+'">'+(arOk&&apOk?'✓ บัญชีย่อยลูกหนี้และเจ้าหนี้ตรงกับบัญชีคุม':'⚠ บัญชีย่อย'+(arOk?'':'ลูกหนี้ ')+(apOk?'':'เจ้าหนี้ ')+'ไม่ตรงกับบัญชีคุม')+'</div>';
  h+='<div class="tw"><table><thead><tr><th>เลขที่</th><th>ชื่อบัญชี</th><th class="num">เดบิต</th><th class="num">เครดิต</th></tr></thead><tbody>'
   +T.rows.map(function(r){return '<tr><td>'+r.a.code+'</td><td>'+esc(r.a.name)+'</td><td class="num">'+fmt(r.dr)+'</td><td class="num">'+fmt(r.cr)+'</td></tr>'}).join('')
   +'<tr class="tot"><td colspan="2">รวม</td><td class="num">'+fmt0(T.td)+'</td><td class="num">'+fmt0(T.tc)+'</td></tr></tbody></table></div></div>';
  return h;
}
function lineList(e,side){
  return e.lines.filter(function(l){return l[side]>0}).map(function(l){return esc(an(l.a))+(l.party?' ('+esc(l.party)+')':'')+' '+fmt0(l[side])}).join('<br>');
}
function vTx(){
  var D=derive(S.entries,null),list=S.entries.slice().sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:a.id-b.id});
  var cnt={P:0,S:0,R:0,D:0,G:0};list.forEach(function(e){cnt[e.j]++});
  var all=JK.every(function(k){return cnt[k]>0}),h='<div class="panel"><h2>ตารางรายการค้า</h2><div class="kpi"><span>ทั้งหมด <b>'+list.length+'</b> รายการ '+(list.length>=15?'✓':'(ขั้นต่ำ 15)')+'</span>'+JK.map(function(k){return '<span>'+JM[k].name.replace('สมุดรายวัน','')+' <b>'+cnt[k]+'</b></span>'}).join('')+'<span>'+(all?'✓ ครบทุกเล่ม':'ยังไม่ครบทุกเล่ม')+'</span></div>';
  if(!list.length)return h+'<p class="empty">ยังไม่มีรายการ</p></div>';
  h+='<div class="actions"><button data-act="copy">คัดลอกตารางเป็นข้อความ</button></div>';
  if(ui.tsv)h+='<label>คัดลอกข้อความนี้ไปวางในสไลด์หรือ Excel<textarea id="tsv" class="tsv" readonly>'+esc(ui.tsv)+'</textarea></label>';
  h+='<div class="tw"><table><thead><tr><th>ที่</th><th>วันที่</th><th>เลขที่</th><th>รายการ</th><th>สมุดที่บันทึก</th><th>เดบิต</th><th>เครดิต</th><th>เหตุผลที่เลือกสมุด</th><th></th></tr></thead><tbody>'
   +list.map(function(e,i){return '<tr><td>'+(i+1)+'</td><td>'+fdate(e.date)+'</td><td>'+esc(e.ref)+'</td><td>'+esc(e.desc)+'</td><td><span class="pill">'+JM[e.j].name.replace('สมุดรายวัน','')+'</span><div class="sub">'+D.jref[e.id]+'</div></td><td>'+lineList(e,'dr')+'</td><td>'+lineList(e,'cr')+'</td><td class="sub">'+esc(e.reason)+'</td><td><button class="small'+(ui.pending==='del'+e.id?' armed':'')+'" data-act="del" data-id="'+e.id+'">'+(ui.pending==='del'+e.id?'ยืนยันลบ':'ลบ')+'</button></td></tr>'}).join('')+'</tbody></table></div></div>';
  return h;
}
function tsvText(){
  var D=derive(S.entries,null),list=S.entries.slice().sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:a.id-b.id});
  var rows=[['ที่','วันที่','เลขที่','รายการ','สมุดที่บันทึก','เดบิต','เครดิต','จำนวนเงิน','เหตุผล']];
  list.forEach(function(e,i){var t=0;e.lines.forEach(function(l){t+=l.dr});
    rows.push([i+1,fdate(e.date),e.ref,e.desc,JM[e.j].name,e.lines.filter(function(l){return l.dr>0}).map(function(l){return an(l.a)}).join(' / '),e.lines.filter(function(l){return l.cr>0}).map(function(l){return an(l.a)}).join(' / '),fmt0(r2(t)),e.reason])});
  return rows.map(function(r){return r.join('\t')}).join('\n');
}
function vCOA(){
  var h='<div class="panel"><h2>ผังบัญชี</h2><p class="hint">กิจการซื้อมาขายไป ใช้ระบบเงินสดและเชื่อแบบวิธีสิ้นงวด (ซื้อสินค้า/ขายสินค้า) ไม่มีภาษีมูลค่าเพิ่ม</p><div class="tw"><table><thead><tr><th>เลขที่</th><th>ชื่อบัญชี</th><th>หมวด</th><th>ยอดปกติ</th><th>บัญชีย่อย</th></tr></thead><tbody>'
  +ACC.map(function(a){return '<tr><td>'+a.code+'</td><td>'+esc(a.name)+'</td><td>'+TYPES[a.type]+'</td><td>'+(a.normal==='D'?'เดบิต':'เครดิต')+'</td><td>'+(a.code==='1102'?'ทะเบียนลูกหนี้':a.code==='2101'?'ทะเบียนเจ้าหนี้':'')+'</td></tr>'}).join('')+'</tbody></table></div></div>';
  return h;
}
function vTest(){
  var h='<div class="panel"><h2>ทดสอบระบบ</h2>'
   +'<h3>1. ลองบันทึกรายการผิด</h3><p class="hint">ไปที่เมนูบันทึกรายการ แล้วลอง เช่น สมุดรายวันทั่วไปที่เดบิตไม่เท่าเครดิต, ใส่เงินสดในสมุดรายวันทั่วไป, รับชำระหนี้เกินยอดลูกหนี้, ซื้อเชื่อในสมุดรายวันทั่วไป ระบบจะปฏิเสธและแสดงเหตุผล ด้านล่างเก็บประวัติการปฏิเสธไว้ให้ใช้ในแบบบันทึกการทดสอบ</p>';
  if(!S.rejects.length)h+='<p class="empty">ยังไม่มีรายการที่ถูกปฏิเสธ</p>';
  else h+='<div class="tw"><table><thead><tr><th>เวลา</th><th>สมุด</th><th>รายการที่ลอง</th><th>ระบบแจ้งว่า</th></tr></thead><tbody>'+S.rejects.map(function(r){var d=new Date(r.t);return '<tr><td class="sub">'+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)+'</td><td>'+JM[r.j].name.replace('สมุดรายวัน','')+'</td><td>'+esc(r.desc)+'</td><td>'+esc(r.msg)+'</td></tr>'}).join('')+'</tbody></table></div><div class="actions"><button data-act="clearrej">ล้างประวัติ</button></div>';
  h+='<h3>2. จำลองข้อผิดพลาดในบัญชีแยกประเภท</h3><p class="hint">ระบบปกติไม่ปล่อยให้เกิดรายการไม่สมดุล ใช้ปุ่มนี้เพิ่มรายการจำลองในบัญชีแยกประเภท เพื่อดูการแจ้งเตือนในหน้างบทดลองและบัญชีย่อย ปิดสวิตช์เมื่อทดสอบเสร็จ</p>'
   +'<div class="chk"><button data-act="inj" data-k="tb" aria-pressed="'+S.inj.tb+'" class="'+(S.inj.tb?'armed':'')+'">'+(S.inj.tb?'ปิด':'เปิด')+': เดบิตเงินสดข้างเดียว 1,000 บาท</button>'
   +'<button data-act="inj" data-k="sub" aria-pressed="'+S.inj.sub+'" class="'+(S.inj.sub?'armed':'')+'">'+(S.inj.sub?'ปิด':'เปิด')+': ลงบัญชีคุมลูกหนี้ 500 บาท ไม่ลงบัญชีย่อย</button></div>';
  if(S.inj.tb||S.inj.sub)h+='<div class="status warn">โหมดจำลองข้อผิดพลาดเปิดอยู่ ไปดูหน้างบทดลอง</div>';
  h+='<h3>3. ตรวจด้วยมือ</h3><p class="hint">เลือกอย่างน้อย 5 รายการจากตารางรายการค้า คำนวณเดบิตเครดิตด้วยตนเองบนกระดาษ แล้วเทียบกับสมุดรายวันและบัญชีแยกประเภทในระบบ จดผลลงแบบบันทึกการใช้ AI</p></div>';
  return h;
}

/* ---------- render ---------- */
var TABS=[['enter','บันทึกรายการ'],['jr','สมุดรายวัน'],['gl','แยกประเภททั่วไป'],['sub','บัญชีย่อย'],['tb','งบทดลอง'],['tx','รายการค้า'],['coa','ผังบัญชี'],['test','ทดสอบระบบ']];
var VIEWS={enter:vEnter,jr:vJournal,gl:vGL,sub:vSub,tb:vTB,tx:vTx,coa:vCOA,test:vTest};
function render(){
  $('shop').value=S.shop;
  $('b-sample').textContent=ui.pending==='sample'?'ยืนยันแทนที่ข้อมูลเดิม':'โหลดตัวอย่าง ('+SAMPLE.length+' รายการ)';
  $('b-sample').classList.toggle('armed',ui.pending==='sample');
  $('b-reset').textContent=ui.pending==='reset'?'ยืนยันล้างทั้งหมด':'ล้างข้อมูลทั้งหมด';
  $('b-reset').classList.toggle('armed',ui.pending==='reset');
  $('banner').innerHTML=S.entries.length?'':'<div class="banner"><span><b>ยังไม่มีรายการ</b> กดปุ่มโหลดตัวอย่างเพื่อดูรายการค้า หรือเริ่มบันทึกรายการเองที่เมนูบันทึกรายการ</span><button class="primary" data-act="sample">โหลดตัวอย่าง</button></div>';
  $('nav').innerHTML=TABS.map(function(t){return '<button role="tab" data-act="tab" data-t="'+t[0]+'" aria-selected="'+(t[0]===ui.tab)+'">'+t[1]+'</button>'}).join('');
  $('view').innerHTML=VIEWS[ui.tab]();
  if(ui.tab==='enter')syncForm();
}
function arm(key,fn){
  if(ui.pending===key){ui.pending=null;fn();return}
  ui.pending=key;render();setTimeout(function(){if(ui.pending===key){ui.pending=null;render()}},4000);
}
function msg(text,cls){var m=$('msg');if(m)m.innerHTML='<div class="status '+cls+'">'+(cls==='bad'?'✗ ':'✓ ')+esc(text)+'</div>'}

document.addEventListener('click',function(ev){
  var b=ev.target.closest('[data-act]');if(!b)return;var a=b.dataset.act;
  if(a==='tab'){ui.tab=b.dataset.t;ui.tsv=null;render()}
  else if(a==='j'){ui.j=b.dataset.j;ui.last=null;render()}
  else if(a==='vj'){ui.vj=b.dataset.j;render()}
  else if(a==='sample'){var go=function(){S.entries=[];S.seq=0;S.rejects=[];var bad=null;SAMPLE.forEach(function(s){var e=tryAdd(s);if(e)bad=e});if(bad)console.warn(bad);S.rejects=[];ui.last=null;ui.tab='tx';save();render()};if(S.entries.length)arm('sample',go);else go()}
  else if(a==='reset'){arm('reset',function(){var shop=S.shop;S=fresh();S.shop=shop;ui.last=null;ui.tab='enter';save();render()})}
  else if(a==='del'){var id=+b.dataset.id;arm('del'+id,function(){var rest=S.entries.filter(function(e){return e.id!==id}),err=checkAll(rest);if(err){ui.tsv=null;alert2('ลบไม่ได้ เพราะรายการอื่นยังอ้างอิงอยู่: '+err);return}S.entries=rest;save();render()})}
  else if(a==='copy'){var t=tsvText();ui.tsv=t;try{navigator.clipboard.writeText(t).then(render,render)}catch(e){render()}}
  else if(a==='addrow'){$('g-rows').insertAdjacentHTML('beforeend',glRow())}
  else if(a==='delrow'){var rows=$('g-rows');if(rows.children.length>2)b.closest('[data-row]').remove()}
  else if(a==='inj'){S.inj[b.dataset.k]=!S.inj[b.dataset.k];save();render()}
  else if(a==='clearrej'){S.rejects=[];save();render()}
});
function alert2(t){var d=document.createElement('div');d.className='status bad';d.textContent=t;$('view').prepend(d);setTimeout(function(){d.remove()},6000)}
document.addEventListener('submit',function(ev){
  if(ev.target.id!=='f')return;ev.preventDefault();
  var err=tryAdd(readSpec(ev.target));
  if(err){var m=$('msg');if(m)m.innerHTML='<div class="status bad">✗ บันทึกไม่ได้: '+esc(err)+'</div>';}
  else{render();msg('บันทึกแล้ว','ok')}
});
document.addEventListener('input',function(ev){if(ev.target.id==='f-reason')ev.target.dataset.edited='1'});
document.addEventListener('change',function(ev){
  var t=ev.target;
  if(t.id==='shop'){S.shop=clean(t.value)||'ร้านสมมติ';save();return}
  if(t.id==='f-kind'){syncForm();return}
  if(t.id==='gl-sel'){ui.acct=t.value;render();return}
  if(t.classList.contains('g-acct')){
    var p=t.closest('[data-row]').querySelector('.g-party'),c=t.value;
    p.disabled=!(c==='1102'||c==='2101');if(p.disabled)p.value='';
    p.setAttribute('list',c==='2101'?'dl-ap':'dl-ar');
  }
});
render();
})();
</script>
